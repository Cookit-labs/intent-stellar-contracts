name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Installed from the release binary rather than built from source:
      # cargo install pulls a dependency chain that no longer compiles on
      # current Rust, and building the CLI is several minutes of CI time for a
      # tool we only invoke once.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@main

      # Tests run natively, which proves the logic but not that the contract
      # can be deployed. Building to WASM is what catches a contract that
      # compiles for the host and not for the chain.
      - name: Build contract WASM
        run: stellar contract build

      - name: Report WASM size
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            echo "$(basename "$f"): $(stat -c%s "$f") bytes"
          done
