name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Downloaded directly rather than via cargo install or the vendor
      # action. cargo install pulls a dependency chain that no longer compiles
      # on current Rust, and stellar/stellar-cli@main 404s fetching its binary.
      # The asset below was verified to exist before pinning.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 27.1.0
        run: |
          set -euo pipefail
          asset="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${asset}"
          curl -sSfL "$url" | sudo tar xz -C /usr/local/bin stellar
          stellar --version

      # Tests run natively, which proves the logic but not that the contract
      # can be deployed. Building to WASM is what catches a contract that
      # compiles for the host and not for the chain.
      - name: Build contract WASM
        run: stellar contract build

      - name: Report WASM size
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            echo "$(basename "$f"): $(stat -c%s "$f") bytes"
          done
